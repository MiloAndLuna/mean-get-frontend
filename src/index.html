<!doctype html>
<!-- ============================================================
  ARCHIVO: src/index.html
  PROPÓSITO: Página HTML base de la aplicación Angular.
  Angular reemplaza <app-root> con el componente raíz en tiempo
  de ejecución. Todo lo demás es renderizado por el framework.
  ============================================================ -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Viewport responsivo para dispositivos móviles -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión Inteligente de Inventario</title>
  <!-- favicon del sitio -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Bootstrap Icons para iconos en la UI -->
  <!-- Fuente Poppins desde Google Fonts: 300 Light, 400 Regular, 500 Medium, 600 SemiBold, 700 Bold -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>
<body>
  <!-- app-root es el selector del componente raíz (AppComponent).
       Angular monta toda la aplicación aquí. -->
  <app-root></app-root>
</body>
</html>
